[project]
name = "half-blood-prince"
version = "0.1.0"
description = "Turn any book into one annotated by the Half-Blood Prince"
readme = "README.md"
requires-python = ">=3.11"
# AGPL-3.0 is required, not chosen: PyMuPDF (AGPL/commercial) and EbookLib
# (AGPL-only) are both load-bearing runtime dependencies. See LICENSE and
# docs/decisions/tech-stack-validation.md.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Robert Lupo", email = "treylupo1197@gmail.com" }]
keywords = ["pdf", "epub", "annotation", "marginalia", "llm", "handwriting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
# Upper bounds are intentional (AUD-38): majors are excluded until reviewed.
# ebooklib
# is pre-1.0 (minor bumps are breaking, and the EPUB renderer depends on its
# write-time head regeneration behavior), so it is capped at the tested minor.
dependencies = [
    "httpx>=0.27.0,<1",
    "platformdirs>=4.0.0,<5",
    "pymupdf>=1.24.0,<2",
    "click>=8.1.0,<9",
    "pydantic>=2.0.0,<3",
    "rich>=13.0.0,<16",
    "ebooklib>=0.18,<0.21",
    "beautifulsoup4>=4.12.0,<5",
    "lxml>=5.0.0,<7",
]

[project.urls]
Homepage = "https://github.com/robertlupo1997/half-blood-prince"
Repository = "https://github.com/robertlupo1997/half-blood-prince"
Issues = "https://github.com/robertlupo1997/half-blood-prince/issues"

[project.optional-dependencies]
eval = ["anthropic>=0.30.0,<2", "rich>=13.0.0,<16"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long strings in personas/prompts; line-length still guides new code

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true  # fitz, ebooklib, bs4 lack stubs

[project.scripts]
halfblood = "halfblood.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halfblood"]

[tool.pytest.ini_options]
testpaths = ["tests"]
